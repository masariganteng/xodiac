<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2e">
  <meta name="description" content="XODIAC Debut Fancon in Indonesia — The Kasablanka Hall, Jakarta. Saturday, 28 November 2026.">
  <title>XODIAC — Debut Fancon in Indonesia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-cluster">
      <img class="jacso-logo" src="assets/LOGO JACSO_BLACK.png" alt="JACSO">
      <span class="brand-divider" aria-hidden="true"></span>
      <img class="xodiac-mini" src="assets/LOGO CXO_BLACK.png" alt="XODIAC">
    </div>

    <div class="ticket-status" id="ticketStatus">
      <strong><span>Ticket Sales &gt;</span></strong>
      <span>Thu, 15 Oct 2026 at 1 PM (Jakarta Local Time)</span>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="eventTitle">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <div class="event-meta meta-left">
        <span>Saturday,</span>
        <strong>28 November 2026</strong>
      </div>

      <div class="event-meta meta-right">
        <span>The Kasablanka Hall,</span>
        <strong>Jakarta</strong>
      </div>
      
      <div class="hero-content">
        <img class="xodiac-lockup" src="assets/LOGO XODIAC.png" alt="XODIAC — Debut Fancon in Indonesia">
        <div class="countdown">
          <div class="digits">
            <span id="days">--</span><i>:</i>
            <span id="hours">--</span><i>:</i>
            <span id="minutes">--</span><i>:</i>
            <span id="seconds">--</span>
          </div>
          <div class="units">
            <span>DAYS</span><span>HOURS</span><span>MINS</span><span>SECS</span>
          </div>
        </div>
        <div class="title-lockup">
        <img src="assets/LOGO IN TO YOU.png" alt="" aria-hidden="true">
      </div>


      </div>

      
      
      
      <button class="scroll-cue" type="button" aria-label="View event details" onclick="document.querySelector('.details').scrollIntoView({behavior:'smooth'})">
        <span></span>
      </button>
      <div class="copyright"><strong>© 2026 JACSO Entertainment &amp; CXO.</strong><br>ALL RIGHTS RESERVED.</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
